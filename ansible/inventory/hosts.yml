---
all:
  children:
    k3s_cluster:
      children:
        k3s_servers:
          hosts:
            k3s-orchestrator:
              ansible_host: 10.0.40.100
              k3s_node_ip: 10.0.40.100
              k3s_init_node: true     # cluster bootstraps from here
            k3s-node-3001:
              ansible_host: 10.0.40.101
              k3s_node_ip: 10.0.40.101
              k3s_init_node: false
            k3s-node-3002:
              ansible_host: 10.0.40.102
              k3s_node_ip: 10.0.40.102
              k3s_init_node: false
        k3s_agents:
          hosts: {}     # add pure workers here
      vars:
        ansible_user: mark
        ansible_python_interpreter: /usr/bin/python3

        # Cluster-wide facts referenced by multiple playbooks.
        k3s_version: "v1.31.4+k3s1"
        k3s_vip: "10.0.40.99"
        k3s_api_hostname: "k3s-api.k3s.lan"
        rancher_hostname: "rancher.k3s.lan"
        jenkins_hostname: "jenkins.k3s.lan"
